[package]
name = "phaselock-native"
version = "0.1.0"
edition = "2024"
description = "The native host of PhaseLock's clients: QuickJS running the Engine over an LMDB store, behind one request protocol every binding serves"
license = "Apache-2.0"
publish = false

[dependencies]
getrandom = "0.3"
phaselock-core = { path = "../../core" }

[build-dependencies]
cc = "1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "thin"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
