[package]
name = "phaselock-jni"
version = "0.1.0"
edition = "2024"
description = "The JNI binding of PhaseLock's native host, for the Kotlin client"
license = "Apache-2.0"
publish = false

[lib]
name = "phaselock_jni"
crate-type = ["cdylib"]

[dependencies]
jni-sys = "0.4"
phaselock-native = { path = "../../native" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "thin"
