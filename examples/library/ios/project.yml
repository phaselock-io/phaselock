# The library's iOS app, for XcodeGen (`xcodegen generate` writes Library.xcodeproj): one universal
# SwiftUI app over the model's Swift package and the Swift client.  A build phase copies the model's
# native bundle into the app: the development bundle into a debug build, the production one into a
# release build.  ./prepare.sh makes everything the build reads.

name: Library
options:
  bundleIdPrefix: io.phaselock.examples
  deploymentTarget:
    iOS: "17.0"
packages:
  LibraryModel:
    path: ../model/LibraryModel
  PhaseLock:
    path: ../../../client/swift
targets:
  Library:
    type: application
    platform: iOS
    sources: [Library]
    dependencies:
      - package: LibraryModel
        product: LibraryModel
      - package: PhaseLock
        product: PhaseLock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.phaselock.examples.library
        PRODUCT_NAME: Library
        INFOPLIST_FILE: Library/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V5VXTTAL92
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        # the native library's simulator slice is Apple silicon's alone
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    postCompileScripts:
      - name: Native bundle
        script: |
          if [ "$CONFIGURATION" = Debug ]; then bundle=native.dev.bundle.js; else bundle=native.bundle.js; fi
          cp "$SRCROOT/../model/$bundle" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/native.bundle.js"
        inputFiles:
          - $(SRCROOT)/../model/native.dev.bundle.js
          - $(SRCROOT)/../model/native.bundle.js
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/native.bundle.js
