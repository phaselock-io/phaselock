// The types the Compose compiler treats as stable.  The model's classes are immutable values,
// decoded whole from each query result, and the List their fields hold is a read-only one that
// never changes once decoded; a new result is a new value.  The model's package also holds its
// Engine and query classes, which the windows only pass along, compared by identity.
kotlin.collections.List
