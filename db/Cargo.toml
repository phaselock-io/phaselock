[package]
name = "phaselockdb"
version = "0.1.0"
edition = "2024"
description = "PhaseLock's v0 database"
license = "Apache-2.0"
publish = false

[[bin]]
name = "phaselockdb"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
ed25519-dalek = "2"
getrandom = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful", "http1", "http2"] }
libc = "0.2"
phaselock-core = { path = "../core" }
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 4

[profile.dev]
panic = "abort"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt", "rt-multi-thread"] }
rcgen = "0.13"
hyper = { version = "1", features = ["client", "http1"] }
tempfile = "3"
